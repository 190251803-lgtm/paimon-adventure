<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#182729" />
    <title>派蒙大冒险</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2250%22 x=%2250%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-size=%2252%22>✦</text></svg>" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <script>
      (() => {
        const syncOrientation = () => {
          const portraitPhone = window.matchMedia("(max-width: 980px) and (orientation: portrait)").matches;
          document.documentElement.classList.toggle("virtual-landscape", portraitPhone);
        };
        syncOrientation();
        window.addEventListener("resize", syncOrientation);
      })();
    </script>
    <div id="app" aria-live="polite"></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
